# Nakładka do lokalnych testów (bez HTTPS, bez prawdziwej domeny):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Otwórz http://localhost. Ustaw w .env: DOMAIN=localhost (żeby compose nie
# narzekało na brakującą zmienną przy interpolacji w docker-compose.yml).

services:
  backend:
    environment:
      CORS_ORIGINS: http://localhost
      PUBLIC_BASE_URL: http://localhost
      COOKIE_SECURE: "false"

  caddy:
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data_dev:/data
      - caddy_config_dev:/config

volumes:
  caddy_data_dev:
  caddy_config_dev:
